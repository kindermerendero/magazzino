<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magazzino</title>
<script src="html5-qrcode.min.js"></script>
<script src="xlsx.full.min.js"></script>
<script src="tracciati.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui, sans-serif; background: #f2f3f5; color: #1c1d1f; }
  header { background: #1f3a5f; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header button { background: none; border: 0; color: #fff; font-size: 22px; }
  main { padding: 16px; max-width: 600px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .tile { aspect-ratio: 1; border: 0; border-radius: 16px; color: #fff; font-size: 18px; font-weight: 600;
          display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  .tile span { font-size: 40px; }
  label { display: block; font-size: 13px; color: #555; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 10px; }
  .row { display: flex; gap: 8px; }
  .btn { padding: 12px 16px; font-size: 16px; border: 0; border-radius: 10px; background: #1f3a5f; color: #fff; }
  .btn.full { width: 100%; margin-top: 14px; }
  .btn.alt { background: #6b7280; }
  .btn:disabled { opacity: .5; }
  label.urg { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; color: #dc2626; margin: 14px 0 6px; }
  label.urg input { width: 24px; height: 24px; }
  #reader { margin-top: 12px; border-radius: 12px; overflow: hidden; }
  .item { background: #fff; border-radius: 12px; padding: 10px 12px; margin-top: 10px; }
  .item.warn { border-left: 5px solid #d97706; }
  .item.ko { border-left: 5px solid #dc2626; }
  .item.ok { border-left: 5px solid #16a34a; }
  .item b { display: block; }
  .item small { color: #666; }
  .item .ubi { font-weight: 700; color: #1f3a5f; margin-top: 4px; }
  .item .foto { margin-top: 8px; padding: 8px 12px; font-size: 14px; }
  .item .ubi span { font-weight: 400; font-size: 13px; color: #666; margin-left: 8px; text-decoration: underline; }
  .qty { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .qty input { width: 90px; text-align: center; padding: 8px; }
  .qty button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid #ccc; background: #fff; font-size: 20px; }
  .qty .del { margin-left: auto; color: #dc2626; }
  #msg { position: fixed; left: 16px; right: 16px; bottom: 16px; padding: 14px; border-radius: 12px; color: #fff;
         background: #1c1d1f; display: none; text-align: center; }
</style>
</head>
<body>
<header><button id="back" hidden onclick="home()">&larr;</button><h1 id="titolo">Magazzino</h1></header>
<main id="main"></main>
<div id="msg"></div>
<!-- campo fisso nella pagina: su iPhone un input creato al volo perde la foto dalla seconda volta -->
<input type="file" id="fotoInput" accept="image/*" capture="environment" hidden>
<script>
const APPS = {
  carico:     { nome: "Carico",     icona: "📥", colore: "#15803d" },
  scarico:    { nome: "Scarico",    icona: "📤", colore: "#b91c1c" },
  inventario: { nome: "Inventario", icona: "📋", colore: "#1d4ed8", rif: "Ubicazione / zona" },
  ordini:     { nome: "Ordini reparto", icona: "🏭", colore: "#7c3aed", rif: "Reparto" },
  acquisti:   { nome: "Richiesta acquisti", icona: "🛒", colore: "#b45309" },
};
// richieste aperte che una funzione può richiamare: lo scarico evade gli ordini reparto, il carico le richieste d'acquisto
const DA = { scarico: { aperti: "ordini", nome: "ordine reparto", icona: "🏭" }, carico: { aperti: "acquisti", nome: "richiesta d'acquisto", icona: "🛒" } };
// URL della distribuzione Apps Script (Distribuisci > Applicazione web)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyTPOkCB28INWWQgK7CcP8pGIuwxJg_jvk-OxIVAbgadqml9J6At4d8NooJVZrUd99VPA/exec";
const $ = s => document.querySelector(s);
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let permesse = store.get("app") || [], prodotti = store.get("prodotti") || {}, ubicazioni = store.get("ubicazioni") || {}, foto = store.get("foto") || {}, tipo = null, bozza = null, scanner = null, armato = false, ordini = [];

async function caricaProdotti(token) {
  const j = await fetch(SCRIPT_URL + "?token=" + encodeURIComponent(token)).then(r => r.json()).catch(() => null);
  if (!j) return avviso("Anagrafica non aggiornata: server non raggiungibile", 3000), true;
  if (j.error) return avviso(j.error, 3000), false;
  prodotti = j.prodotti; store.set("prodotti", prodotti);
  permesse = j.app || []; store.set("app", permesse);
  ubicazioni = j.ubicazioni || {}; store.set("ubicazioni", ubicazioni);
  foto = j.foto || {}; store.set("foto", foto); return true;
}

function accesso() {
  $("#back").hidden = true; $("#titolo").textContent = "Magazzino";
  $("#main").innerHTML = `<label>Codice di accesso</label>
    <div class="row"><input id="tok" type="password" autocapitalize="none" autocorrect="off">
    <button class="btn alt" aria-label="Mostra codice" onclick="const t=$('#tok'); t.type = t.type === 'password' ? 'text' : 'password'">👁</button></div>
    <button class="btn full" id="entra">Entra</button>`;
  $("#entra").onclick = async () => {
    const t = $("#tok").value.trim();
    if (t && await caricaProdotti(t)) { store.set("token", t); home(); }
  };
}
const salva = () => store.set("bozza_" + tipo, bozza);

function avviso(t, ms = 2000) {
  const m = $("#msg"); m.textContent = t; m.style.display = "block";
  clearTimeout(m._t); m._t = setTimeout(() => m.style.display = "none", ms);
}

async function fermaScanner() {
  if (scanner) { try { await scanner.stop(); } catch {} scanner = null; }
}

async function home() {
  await fermaScanner(); tipo = null;
  $("#back").hidden = true; $("#titolo").textContent = "Magazzino";
  // il server rifiuta comunque le funzioni non consentite: qui si nascondono solo i riquadri
  $("#main").innerHTML = `<div class="grid">${Object.entries(APPS).filter(([k]) => permesse.includes(k)).map(([k, a]) =>
    `<button class="tile" style="background:${a.colore}" onclick="apri('${k}')"><span>${a.icona}</span>${a.nome}</button>`).join("")}</div>
    <button class="btn full alt" onclick="esci()">Cambia codice di accesso</button>`;
}

function esci() {
  if (!confirm("Uscire? Servirà di nuovo il codice di accesso.")) return;
  try { localStorage.removeItem("token"); } catch {}
  accesso();
}

function apri(t) {
  fermaScanner(); tipo = t; const a = APPS[t];
  bozza = store.get("bozza_" + t) || { riferimento: "", righe: [] };
  $("#back").hidden = false; $("#titolo").textContent = a.nome;
  $("#main").innerHTML = `
    ${!DA[t] ? "" : bozza.ordine
      ? `<div class="item"><b>${DA[t].icona} ${esc(bozza.nomeOrdine || bozza.riferimento)}</b><small>${esc(bozza.dataOrdine)}</small>
         <div class="qty"><button class="del" onclick="sganciaOrdine()">✕</button></div></div>`
      : `<button class="btn full alt" onclick="elencoOrdini()">${DA[t].icona} Richiama ${DA[t].nome}</button>`}
    ${a.rif ? `<label>${a.rif}</label><input id="rif" value="${esc(bozza.riferimento)}">` : ""}
    ${t !== "ordini" && t !== "acquisti" ? "" : `
      <label class="urg"><input type="checkbox" id="urg" ${bozza.urgente ? "checked" : ""}> 🚨 URGENTE</label>
      <input id="motivo" placeholder="Motivo urgenza (obbligatorio)" value="${esc(bozza.motivo)}" ${bozza.urgente && t === "ordini" ? "" : "hidden"}>`}
    <label>Operatore</label><input id="op" value="${esc(store.get("operatore") || "")}">
    <button class="btn full alt" id="cam" onclick="toggleCam()">📷 Avvia scansione</button>
    <div id="reader"></div>
    <button class="btn full" id="scatta" hidden onclick="arma()">🎯 Scansiona</button>
    <label>Codice manuale o lettore barcode</label>
    <div class="row"><input id="cod" enterkeyhint="done"><button class="btn" onclick="manuale()">+</button></div>
    <div id="lista"></div>
    <button class="btn full" id="invia" onclick="invia()">Genera Excel</button>`;
  if (a.rif) $("#rif").oninput = e => { bozza.riferimento = e.target.value; salva(); };
  if ($("#urg")) {
    $("#urg").onchange = e => { bozza.urgente = e.target.checked; $("#motivo").hidden = !bozza.urgente || tipo !== "ordini"; salva(); };
    $("#motivo").oninput = e => { bozza.motivo = e.target.value; salva(); };
  }
  $("#op").oninput = e => store.set("operatore", e.target.value);
  $("#cod").onkeydown = e => { if (e.key === "Enter") manuale(); };
  disegna();
}

async function elencoOrdini() {
  const j = await fetch(SCRIPT_URL + "?aperti=" + DA[tipo].aperti + "&token=" + encodeURIComponent(store.get("token"))).then(r => r.json()).catch(() => null);
  if (!j || j.error) return avviso("Ordini non disponibili: " + (j?.error || "server non raggiungibile"), 3000);
  ordini = j.ordini.sort((a, b) => !!b.urgente - !!a.urgente); // urgenti in cima, poi dal più vecchio
  if (!ordini.length) return avviso("Nessuna " + DA[tipo].nome + " aperta");
  $("#lista").innerHTML = ordini.map((o, i) => `
    <div class="item ${o.urgente ? "ko" : ""}" onclick="evadi(${i})"><b>${o.urgente ? "🚨 URGENTE — " : ""}${esc(o.reparto || "Richiesta acquisti")}</b>
      ${o.urgente ? `<small>Motivo: ${esc(o.motivo)}</small><br>` : ""}<small>${esc(o.data)} · ${o.righe.length} articoli · ${esc(o.operatore)}</small></div>`).join("");
}

function evadi(i) {
  if (bozza.righe.length && !confirm("Sostituire gli articoli già scansionati con la " + DA[tipo].nome + "?")) return;
  const o = ordini[i];
  bozza = { riferimento: o.reparto, ordine: o.id, dataOrdine: o.data, nomeOrdine: (o.urgente ? "URGENTE " : "") + (o.reparto || "Richiesta acquisti"),
            righe: o.righe.map(r => ({ codice: r.codice, descrizione: r.descrizione, richiesta: r.qta, qta: 0, dichiarata: "" })) };
  salva(); apri(tipo);
}

function sganciaOrdine() {
  if (!confirm("Sganciare la " + DA[tipo].nome + "? Resta aperta.")) return;
  bozza = { riferimento: "", righe: [] }; salva(); apri(tipo);
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]); }

function aggiungi(codice) {
  codice = codice.trim(); if (!codice) return;
  let r = bozza.righe.find(x => x.codice === codice);
  if (r) r.qta++;
  else bozza.righe.unshift(r = { codice, descrizione: prodotti[codice] || "", qta: 1, dichiarata: "", giacenza: "" });
  navigator.vibrate?.(80);
  avviso(prodotti[codice] ? `${codice} — ${prodotti[codice]} (${r.qta})` : `⚠️ ${codice} non in anagrafica`);
  salva(); disegna();
}

function manuale() { const i = $("#cod"); aggiungi(i.value); i.value = ""; i.focus(); }

function arma() { armato = true; $("#scatta").disabled = true; $("#scatta").textContent = "Inquadra il codice…"; }
function disarma() { armato = false; const b = $("#scatta"); if (b) { b.disabled = false; b.textContent = "🎯 Scansiona"; } }

async function toggleCam() {
  if (scanner) { await fermaScanner(); $("#cam").textContent = "📷 Avvia scansione"; $("#scatta").hidden = true; return; }
  scanner = new Html5Qrcode("reader");
  try {
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 260, height: 160 } }, c => {
      if (!armato) return; // legge solo dopo il tocco su "Scansiona": niente QR vicini letti per sbaglio
      disarma(); aggiungi(c);
    });
    $("#cam").textContent = "⏹ Spegni fotocamera"; disarma(); $("#scatta").hidden = false;
  } catch (e) { scanner = null; avviso("Fotocamera non disponibile: " + e, 4000); }
}

function stato(r) {
  if (tipo === "scarico" && r.richiesta !== undefined) return r.qta >= r.richiesta ? "ok" : r.qta ? "warn" : "ko";
  if (tipo !== "carico" || r.dichiarata === "") return r.descrizione ? "" : "warn";
  return Number(r.dichiarata) === Number(r.qta) ? "ok" : "ko";
}

function disegna() {
  $("#lista").innerHTML = bozza.righe.map((r, i) => `
    <div class="item ${stato(r)}">
      <b>${esc(r.codice)}</b><small>${esc(r.descrizione) || "Non in anagrafica"}</small>
      ${tipo === "scarico" ? `<div class="ubi" onclick="modificaUbicazione(${i})">📍 ${esc(ubicazioni[r.codice]) || "ubicazione non nota"} <span>✎ modifica</span></div>` : ""}
      ${tipo === "scarico" && !foto[r.codice] ? `<button class="btn alt foto" onclick="scattaFoto(${i}, this)">📷 Foto prodotto</button>` : ""}
      ${r.richiesta !== undefined ? `<small>${tipo === "carico" ? "Ordinati" : "Richiesti"}: ${r.richiesta}</small>` : ""}
      ${tipo === "acquisti" ? `<div class="qty">Giacenza <input type="number" inputmode="decimal" value="${esc(r.giacenza)}" onchange="campo(${i},'giacenza',this.value)"><button class="del" onclick="rimuovi(${i})">✕</button></div>` : ""}
      ${tipo === "carico" ? `<div class="qty">Bolla <input type="number" inputmode="decimal" value="${esc(r.dichiarata)}" onchange="campo(${i},'dichiarata',this.value)"></div>` : ""}
      ${tipo === "acquisti" ? "" : `<div class="qty">${tipo === "carico" ? "Contati" : r.richiesta !== undefined ? "Prelevati" : "Qtà"}
        <button onclick="campo(${i},'qta',${r.qta}-1)">−</button>
        <input type="number" inputmode="decimal" value="${r.qta}" onchange="campo(${i},'qta',this.value)">
        <button onclick="campo(${i},'qta',${r.qta}+1)">+</button>
        <button class="del" onclick="rimuovi(${i})">✕</button>
      </div>`}
    </div>`).join("");
}

async function modificaUbicazione(i) {
  const codice = bozza.righe[i].codice;
  let u = prompt(`Ubicazione di ${codice} (vuoto = cancella)`, (ubicazioni[codice] || "").replace(/ \?$/, ""));
  if (u === null) return;
  u = u.trim().toUpperCase();
  const j = await fetch(SCRIPT_URL, {
    method: "POST", headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ token: store.get("token"), tipo: "ubicazione", codice, ubicazione: u }),
  }).then(r => r.json()).catch(() => null);
  if (!j || j.error) return avviso("Ubicazione non salvata: " + (j?.error || "server non raggiungibile"), 4000);
  if (u) ubicazioni[codice] = u; else delete ubicazioni[codice];
  store.set("ubicazioni", ubicazioni); disegna(); avviso(`Ubicazione di ${codice} salvata`);
}

// foto ridotta sul telefono (lato lungo 1200 px, JPEG) per un invio rapido anche con wifi scarso
function scattaFoto(i, btn) {
  const codice = bozza.righe[i].codice, inp = $("#fotoInput");
  inp.value = ""; // stessa foto due volte deve comunque generare "change"
  inp.onchange = async () => {
    if (!inp.files[0]) return;
    btn.disabled = true; btn.textContent = "Caricamento foto…";
    let j;
    try {
      const img = await createImageBitmap(inp.files[0]), k = Math.min(1, 1200 / Math.max(img.width, img.height));
      const cv = Object.assign(document.createElement("canvas"), { width: img.width * k, height: img.height * k });
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      j = await fetch(SCRIPT_URL, {
        method: "POST", headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ token: store.get("token"), tipo: "foto", codice, file: cv.toDataURL("image/jpeg", 0.8).split(",")[1] }),
      }).then(r => r.json()).catch(() => ({ error: "server non raggiungibile" }));
    } catch (e) { j = { error: "immagine non leggibile (" + e.message + ")" }; }
    if (j.error) { btn.disabled = false; btn.textContent = "📷 Foto prodotto"; return avviso("Foto non salvata: " + j.error, 6000); }
    foto[codice] = 1; store.set("foto", foto); disegna(); avviso(`Foto di ${codice} salvata`);
  };
  inp.click();
}

function campo(i, k, v) { bozza.righe[i][k] = k === "qta" ? Math.max(0, Number(v) || 0) : v; salva(); disegna(); }
function rimuovi(i) { bozza.righe.splice(i, 1); salva(); disegna(); }

async function invia() {
  if (APPS[tipo].rif && !bozza.riferimento.trim()) return avviso("Inserisci " + APPS[tipo].rif);
  if (!bozza.righe.length) return avviso("Nessun articolo");
  if (tipo === "carico" && bozza.righe.some(r => r.dichiarata === "")) return avviso("Manca la quantità di bolla su qualche riga");
  if (tipo === "acquisti" && bozza.righe.some(r => r.giacenza === "" || r.giacenza === undefined)) return avviso("Manca la giacenza su qualche riga");
  if (tipo === "ordini" && bozza.urgente && !bozza.motivo?.trim()) return avviso("Scrivi il motivo dell'urgenza");
  const btn = $("#invia"); btn.disabled = true; btn.textContent = "Invio in corso…";
  const d = new Date(), data = d.toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" });
  const rif = bozza.riferimento.trim(), op = $("#op").value.trim();
  const ws = XLSX.utils.aoa_to_sheet([TRACCIATI[tipo], ...bozza.righe.map(r => rigaExcel(tipo, data, rif, op, { ...r, urgente: bozza.urgente }))]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, tipo);
  // text/plain evita il preflight CORS, che Apps Script non gestisce
  const j = await fetch(SCRIPT_URL, {
    method: "POST", headers: { "Content-Type": "text/plain" },
    body: JSON.stringify({ token: store.get("token"), tipo, nome: nomeFile(tipo, d, (tipo === "acquisti" && bozza.urgente ? "URGENTE " : "") + rif), file: XLSX.write(wb, { type: "base64", bookType: "xlsx" }),
      ordine: bozza.ordine, reparto: rif, data, operatore: op, urgente: !!$("#urg") && !!bozza.urgente, motivo: tipo === "ordini" ? bozza.motivo?.trim() : "",
      righe: tipo === "ordini" || tipo === "acquisti" ? bozza.righe.map(r => ({ codice: r.codice, descrizione: r.descrizione, qta: tipo === "ordini" ? r.qta : undefined })) : undefined }),
  }).then(r => r.json()).catch(() => null);
  if (!j || j.error) return btn.disabled = false, btn.textContent = "Genera Excel", avviso("Errore invio: " + (j?.error || "server non raggiungibile") + " — i dati restano salvati", 4000);
  // bozza cancellata solo dopo conferma di scrittura del file
  bozza = { riferimento: "", righe: [] }; salva(); apri(tipo);
  if (j.avviso === false) avviso("Ordine salvato, ma l'avviso al magazzino NON è partito: chiama il magazziniere", 6000);
  else avviso(j.avviso ? "Salvato e magazziniere avvisato" : "Salvato: " + j.file, 3000);
}

const tok = store.get("token");
if (tok) { home(); caricaProdotti(tok).then(ok => ok ? (tipo || home()) : accesso()); } else accesso();
</script>
</body>
</html>
